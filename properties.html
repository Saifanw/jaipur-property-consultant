<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties for Sale in Jaipur | Jaipur Property Consultant</title>
<meta name="description" content="Browse approved plots, houses, shops and land for sale in Jaipur and Jhotwara. Filter by area, type and budget. Save and share properties.">
<meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0DW0NBETML"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-0DW0NBETML');</script>
</head>
<body>
<div data-chrome="properties"></div>

<main>
<section class="phero" style="padding:30px 0 26px">
  <div class="container"><div class="crumbs"><a href="index.html">Home</a> / Properties</div><h1 id="h1">Properties for sale in Jaipur</h1></div>
</section>

<div class="fbar" role="search">
  <div class="container">
    <div class="fbar-in" id="fbarIn">
      <label class="fs"><span class="sr-only">Search</span><input id="q" type="search" placeholder="Try: 50 gaj plot Jhotwara under 40 lakh" autocomplete="off"></label>
      <button class="btn btn-light ft" id="ft" type="button" aria-expanded="false">Filters<span class="saved-count" id="fcount" style="display:none;margin-left:6px"></span></button>
      <label class="fsel"><span class="sr-only">Area</span><select id="fArea"><option value="">All areas</option></select></label>
      <label class="fsel"><span class="sr-only">Type</span><select id="fType"><option value="">All types</option></select></label>
      <label class="fsel"><span class="sr-only">Budget</span><select id="fBudget"><option value="">Any budget</option><option value="2500000">Up to ₹25 Lakh</option><option value="5000000">Up to ₹50 Lakh</option><option value="10000000">Up to ₹1 Crore</option><option value="20000000">Up to ₹2 Crore</option><option value="999999999">Above ₹2 Crore</option></select></label>
      <label class="fsel"><span class="sr-only">Sort</span><select id="fSort"><option value="rel">Best match</option><option value="new">Newest first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></label>
    </div>
  </div>
</div>

<div class="container">
  <div class="cat-tabs" id="catTabs" role="tablist" aria-label="Property category">
    <button type="button" class="cat-tab on" data-cat="" role="tab">All</button>
    <button type="button" class="cat-tab" data-cat="House" role="tab">House</button>
    <button type="button" class="cat-tab" data-cat="Commercial" role="tab">Commercial</button>
    <button type="button" class="cat-tab" data-cat="Others" role="tab">Others</button>
  </div>
  <div class="fchips" id="tryRow" style="padding-top:12px"></div>
  <div class="rbar"><b id="count">Loading…</b><div class="fchips" id="chips"></div></div>
  <div class="grid-p" id="grid"><div class="empty-box">Loading properties…</div></div>
  <div class="morewrap"><button class="btn btn-light" id="more" type="button" style="display:none">Show more properties</button></div>

  <section class="sec" style="padding-bottom:0">
    <div class="cta-band"><div><h2>Own a property? Sell it through us.</h2><p>See the commission rates and list your property for free.</p></div><a class="btn btn-gold" href="partner.html">Sell &amp; earn</a></div>
  </section>
</div>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/config.js"></script>
<script src="assets/match.js"></script>
<script src="assets/sprite.js"></script>
<script src="assets/app.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const db = getFirestore(initializeApp({apiKey:"AIzaSyBVkbB7kLROVu_dB-ghT906PHRSq2kscnU",authDomain:"jaipur-property-consultant.firebaseapp.com",projectId:"jaipur-property-consultant",storageBucket:"jaipur-property-consultant.firebasestorage.app",messagingSenderId:"502971407075",appId:"1:502971407075:web:ee4dabc90db9f592ebc3d6"},"publicSite"));
const { $, esc, tidy, cleanArea, hidden, millis, propertyCard, savedList, inr, SITE } = JPC;
const PAGE = 9;
let all = [], shown = PAGE, savedOnly = false, scores = new Map(), cat = "";
const P = new URLSearchParams(location.search);
savedOnly = P.get("saved") === "1";
if(["House","Commercial","Others"].includes(P.get("cat"))) cat = P.get("cat");
$("q").value = P.get("q") || ""; 
const BLABEL = { 2500000:"Up to ₹25 Lakh", 5000000:"Up to ₹50 Lakh", 10000000:"Up to ₹1 Crore", 20000000:"Up to ₹2 Crore", 999999999:"Above ₹2 Crore" };

const price = p => Number(p.budgetMin ?? p.budgetMax ?? 0) || Number(p.budgetMax ?? 0) || 0;
function fillOptions(){
  const keep = { a:$("fArea").value, t:$("fType").value };
  const areas = [...new Set(all.map(p => cleanArea(p.area)).filter(Boolean))].sort((a,b) => a.localeCompare(b));
  const types = [...new Set(all.map(p => p.propertyType).filter(Boolean))].sort();
  $("fArea").innerHTML = '<option value="">All areas</option>' + areas.map(a => `<option>${esc(a)}</option>`).join("");
  $("fType").innerHTML = '<option value="">All types</option>' + types.map(t => `<option>${esc(t)}</option>`).join("");
  $("fArea").value = areas.includes(keep.a) ? keep.a : ""; $("fType").value = types.includes(keep.t) ? keep.t : "";
}
function filtered(){
  const raw = $("q").value.trim(), area = $("fArea").value, type = $("fType").value, bud = Number($("fBudget").value || 0), saved = savedList();
  let list = all.filter(p => {
    if(savedOnly && !saved.includes(p.id)) return false;
    if(area && cleanArea(p.area) !== area) return false;
    if(type && p.propertyType !== type) return false;
    if(cat && SITE.categoryOf(p.propertyType) !== cat) return false;
    if(bud){ const pr = price(p); if(bud === 999999999 ? pr <= 20000000 : (!pr || pr > bud)) return false; }
    return true;
  });
  scores = new Map();
  if(raw){ const hits = JPCMatch.search(list, raw); hits.forEach(h => scores.set(h.p.id, h.score)); list = hits.map(h => h.p); }
  const s = $("fSort").value;
  if(s === "low") list.sort((a,b) => (price(a)||1e12) - (price(b)||1e12));
  else if(s === "high") list.sort((a,b) => price(b) - price(a));
  else if(s === "rel" && raw) list.sort((a,b) => (scores.get(b.id)||0) - (scores.get(a.id)||0) || millis(b.updatedAt) - millis(a.updatedAt));
  else list.sort((a,b) => millis(b.updatedAt) - millis(a.updatedAt));
  return list;
}
/* nothing matched: show the closest properties instead of a dead end */
function closest(){
  const q = JPCMatch.parseQuery($("q").value), bud = Number($("fBudget").value || 0);
  const buyer = JPCMatch.queryAsBuyer(q);
  if(!buyer.area && $("fArea").value) buyer.area = $("fArea").value;
  if(!buyer.propertyType && $("fType").value) buyer.propertyType = $("fType").value;
  if(!buyer.budgetMax && bud && bud < 999999999) buyer.budgetMax = bud;
  if(!buyer.area && !buyer.propertyType && !buyer.budgetMax && !buyer.budgetMin) return [];
  return all.map(p => ({ p, s: JPCMatch.score(buyer, p).score })).filter(x => x.s >= 45).sort((a,b) => b.s - a.s).slice(0, 6).map(x => x.p);
}
function sync(){
  const p = new URLSearchParams(), g = id => $(id).value;
  if(g("q").trim()) p.set("q", g("q").trim());
  if(g("fArea")) p.set("area", g("fArea"));
  if(g("fType")) p.set("type", g("fType"));
  if(cat) p.set("cat", cat);
  if(g("fBudget")) p.set("budget", g("fBudget"));
  if(g("fSort") && g("fSort") !== "rel") p.set("sort", g("fSort"));
  if(savedOnly) p.set("saved", "1");
  history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
}
function render(){
  const list = filtered(), vis = list.slice(0, shown);
  document.querySelectorAll(".cat-tab").forEach(b => {
    const c = b.dataset.cat; b.classList.toggle("on", c === cat);
    const n = all.filter(p => !c || SITE.categoryOf(p.propertyType) === c).length;
    b.innerHTML = (c || "All") + (all.length ? ` <span class="cnt">${n}</span>` : "");
  });
  $("h1").textContent = savedOnly ? "Your saved properties" : "Properties for sale in Jaipur";
  $("count").textContent = list.length ? `${list.length} ${list.length === 1 ? "property" : "properties"}` : "No properties found";
  const chips = [];
  if(savedOnly) chips.push(["saved", "Saved only"]);
  if($("q").value.trim()) chips.push(["q", `“${$("q").value.trim()}”`]);
  if($("fArea").value) chips.push(["fArea", $("fArea").value]);
  if(cat) chips.push(["cat", cat]);
  if($("fType").value) chips.push(["fType", $("fType").value]);
  if($("fBudget").value) chips.push(["fBudget", BLABEL[$("fBudget").value]]);
  $("chips").innerHTML = chips.map(c => `<button class="fchip" type="button" data-clear="${c[0]}">${esc(c[1])} ×</button>`).join("") + (chips.length ? '<button class="fchip" type="button" data-clear="all">Clear all</button>' : "");
  const n = chips.filter(c => c[0] !== "q" && c[0] !== "saved").length; $("fcount").textContent = n || ""; $("fcount").style.display = n ? "inline-grid" : "none";
  const rawQ = $("q").value.trim();
  let gridHtml;
  if(vis.length) gridHtml = vis.map(propertyCard).join("");
  else {
    const near = savedOnly ? [] : closest();
    const wa = JPC.wa("Hello, I am looking for a property in Jaipur" + (rawQ ? ": " + rawQ : "") + ". Please share options.");
    gridHtml = `<div class="empty-box"><strong>${savedOnly ? "You have not saved any property yet" : "No exact match found"}</strong>${savedOnly ? "Tap the heart on a property to keep it here." : (near.length ? "These are the closest properties. You can also tell us exactly what you need." : "Try a wider budget or another area, or tell us what you need.")}<br><a class="btn btn-gold" style="margin-top:14px" target="_blank" rel="noopener" href="${wa}">Tell us your requirement on WhatsApp</a></div>`;
    if(near.length) gridHtml += `<h2 style="grid-column:1/-1;font-size:20px;margin:18px 0 0">Closest matches</h2>` + near.map(propertyCard).join("");
  }
  $("grid").innerHTML = gridHtml;
  const areas0 = [...$("fArea").options].map(o => o.value).filter(Boolean), types0 = [...$("fType").options].map(o => o.value).filter(Boolean);
  const ta = areas0[0] || "Jhotwara", tt = types0[0] || "Plot";
  const tries = [`${tt} in ${ta}`, `${tt} under 50 lakh`, `100 gaj ${ta}`];
  $("tryRow").innerHTML = (rawQ || chips.length || savedOnly) ? "" : '<span style="font-size:13px;color:var(--mut);align-self:center">Try:</span>' + tries.map(t => `<button class="fchip" type="button" data-try="${esc(t)}">${esc(t)}</button>`).join("");
  $("more").style.display = list.length > shown ? "inline-flex" : "none";
  document.dispatchEvent(new Event("jpc:rendered")); sync();
}
["q"].forEach(id => $(id).addEventListener("input", () => { shown = PAGE; render(); }));
$("catTabs").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if(!b) return; cat = b.dataset.cat; shown = PAGE; render(); });
["fArea","fType","fBudget","fSort"].forEach(id => $(id).addEventListener("change", () => { shown = PAGE; render(); }));
$("more").onclick = () => { shown += PAGE; render(); };
$("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-clear]"); if(!b) return; const k = b.dataset.clear;
  if(k === "cat"){ cat = ""; shown = PAGE; render(); return; }
  if(k === "all"){ savedOnly = false; cat = ""; ["q","fArea","fType","fBudget"].forEach(id => $(id).value = ""); }
  else if(k === "saved") savedOnly = false; else $(k).value = "";
  shown = PAGE; render();
});
$("tryRow").addEventListener("click", e => { const b = e.target.closest("[data-try]"); if(!b) return; $("q").value = b.dataset.try; shown = PAGE; render(); });
$("ft").onclick = () => { const c = $("fbarIn").classList.toggle("closed"); $("ft").setAttribute("aria-expanded", String(!c)); };
if(matchMedia("(max-width:640px)").matches) $("fbarIn").classList.add("closed");
document.addEventListener("jpc:saved", () => { if(savedOnly) render(); });

if(P.get("sort") && [...$("fSort").options].some(o => o.value === P.get("sort"))) $("fSort").value = P.get("sort");
if(P.get("type")) setTimeout(() => { $("fType").value = P.get("type"); render(); }, 0);
if(P.get("budget")) setTimeout(() => { $("fBudget").value = P.get("budget"); render(); }, 0);
onSnapshot(query(collection(db, "publicRequirements"), where("type", "==", "seller")), snap => {
  all = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(r => !hidden(r.status) && String(r.availability || "Available") !== "Not Available");
  fillOptions();
  if(P.get("area") && [...$("fArea").options].some(o => o.value === P.get("area"))) $("fArea").value = P.get("area");
  if(P.get("type") && [...$("fType").options].some(o => o.value === P.get("type"))) $("fType").value = P.get("type");
  if(P.get("budget") && [...$("fBudget").options].some(o => o.value === P.get("budget"))) $("fBudget").value = P.get("budget");
  render();
}, () => { $("count").textContent = "Could not load"; $("grid").innerHTML = '<div class="empty-box"><strong>Properties could not be loaded right now</strong>Please check your internet connection or message us on WhatsApp.</div>'; });
</script>
<script type="module" src="assets/jpc-analytics-tracker.js"></script>
</body>
</html>
