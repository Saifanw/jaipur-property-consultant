<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Property Details | Jaipur Property Consultant</title>
<meta name="description" content="Detailed property information, photos and video from Jaipur Property Consultant.">
<style>
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fa;color:#182437}
.wrap{width:min(980px,94%);margin:auto}.head{background:#111c2d;color:#fff;padding:18px 0}
.head a{color:#e8c45c;text-decoration:none}.card{margin:35px auto;background:#fff;border:1px solid #dfe5ec;border-radius:20px;overflow:hidden;box-shadow:0 14px 40px rgba(17,28,45,.1)}
.heroimg{height:430px;background:#e9eef3;display:grid;place-items:center;overflow:hidden}.heroimg img{width:100%;height:100%;object-fit:cover}
.body{padding:25px}.badge{display:inline-block;background:#eef4ff;color:#275da8;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}
.muted{color:#66758a;font-size:12px}.price{font-size:25px;font-weight:950;color:#8a6500;margin:15px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.item{background:#f5f7f9;border-radius:10px;padding:12px}.item b{display:block;font-size:10px;color:#66758a;text-transform:uppercase}.item span{display:block;margin-top:4px;font-weight:800}
.section{margin-top:28px}.section h2{font-size:18px;margin:0 0 12px}.details-box{background:#f7f9fb;border:1px solid #e3e8ee;border-radius:13px;padding:16px;line-height:1.65;color:#435166;white-space:pre-line}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery button{border:0;padding:0;background:#eef2f5;border-radius:12px;overflow:hidden;cursor:pointer;height:150px}.gallery img{width:100%;height:100%;object-fit:cover}
.video-wrap{background:#101923;border-radius:14px;overflow:hidden}.video-wrap video{display:block;width:100%;max-height:520px}
.notice{padding:12px;border-radius:10px;background:#f3f7fb;font-size:11px;color:#5c6c7e}
.btn{display:inline-block;padding:12px 16px;border-radius:9px;font-weight:850;text-decoration:none}.green{background:#128a4d;color:#fff}.gold{background:#c79a25;color:#fff}
.actions{margin-top:18px;display:flex;gap:9px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;background:rgba(7,14,24,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:12px}.close{position:absolute;top:18px;right:22px;border:0;background:#fff;color:#111;padding:9px 13px;border-radius:9px;font-weight:900;cursor:pointer}
@media(max-width:650px){.heroimg{height:270px}.grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.gallery button{height:120px}.body{padding:19px}}
</style>
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0DW0NBETML"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-0DW0NBETML');</script>
</head>
<body>
<header class="head"><div class="wrap"><strong>Jaipur Property Consultant</strong><span style="float:right"><a href="properties.html">← All Properties</a></span></div></header>
<main class="wrap"><div id="content" class="card">
  <div class="heroimg" id="image">🏡</div>
  <div class="body"><div id="loading">Loading property...</div></div>
</div></main>
<div id="lightbox" class="lightbox"><button class="close" id="closeLightbox">✕ Close</button><img id="lightboxImg" alt="Property photo"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBVkbB7kLROVu_dB-ghT906PHRSq2kscnU",authDomain:"jaipur-property-consultant.firebaseapp.com",projectId:"jaipur-property-consultant",storageBucket:"jaipur-property-consultant.firebasestorage.app",messagingSenderId:"502971407075",appId:"1:502971407075:web:ee4dabc90db9f592ebc3d6"};
const db=getFirestore(initializeApp(cfg,"propertyDetail"));
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=(a,b)=>{const f=n=>n==null?"":"₹"+Number(n).toLocaleString("en-IN");return a!=null&&b!=null?`${f(a)} – ${f(b)}`:b!=null?`Up to ${f(b)}`:a!=null?`From ${f(a)}`:"Price on enquiry"};
const id=new URLSearchParams(location.search).get("id");

function item(label,value){return value?`<div class="item"><b>${esc(label)}</b><span>${esc(value)}</span></div>`:""}
function openLightbox(src){$("lightboxImg").src=src;$("lightbox").classList.add("open")}
$("closeLightbox").onclick=()=>$("lightbox").classList.remove("open");
$("lightbox").onclick=e=>{if(e.target===$("lightbox"))$("lightbox").classList.remove("open")};

if(!id){$("loading").textContent="Property not found."}
else{
 getDoc(doc(db,"publicRequirements",id)).then(s=>{
  if(!s.exists()||!["Approved","approved"].includes(s.data().status)){
    $("loading").textContent="This property/requirement is not available.";return;
  }
  const p={id:s.id,...s.data()};
  const images=[...new Set((Array.isArray(p.imageUrls)?p.imageUrls:[]).filter(Boolean))];
  if(!images.length&&p.imageDataUrl)images.push(p.imageDataUrl);
  $("image").innerHTML=images[0]?`<img src="${esc(images[0])}" alt="Property in ${esc(p.area||"Jaipur")}">`:"🏡";

  const details=[
    item("Size / Area",p.size),
    item("Property Type",p.propertyType||"Property"),
    item("Location",p.area?`${p.area}, ${p.city||"Jaipur"}`:p.city||"Jaipur"),
    item("Facing / Road",p.roadFacing),
    item("Property Location",p.propertyLocation),
    item("Price",money(p.budgetMin,p.budgetMax)),
    item("Contact", "Through Jaipur Property Consultant")
  ].join("");

  const gallery=images.length>1?`
    <section class="section"><h2>📸 Property Photos</h2>
      <div class="gallery">${images.map((u,i)=>`<button type="button" data-photo="${esc(u)}" aria-label="Open property photo ${i+1}"><img src="${esc(u)}" alt="Property photo ${i+1}"></button>`).join("")}</div>
    </section>`:"";

  const video=p.videoUrl?`
    <section class="section"><h2>🎥 Property Video</h2>
      <div class="video-wrap"><video controls playsinline preload="metadata" src="${esc(p.videoUrl)}"></video></div>
    </section>`:"";

  $("loading").innerHTML=`
    <span class="badge">${esc(p.propertyType||"Property")}</span>
    <h1>${esc(p.publicDisplayName||"Property Available")}</h1>
    <div class="muted">📍 ${esc(p.area||"Jaipur")}, ${esc(p.city||"Jaipur")}</div>
    <div class="price">${money(p.budgetMin,p.budgetMax)}</div>
    <div class="grid">${details}</div>
    <section class="section"><h2>📋 Property Details</h2><div class="details-box">${esc(p.details||"Property details available on enquiry.")}</div></section>
    ${gallery}${video}
    <div class="notice" style="margin-top:24px">🔐 Owner contact and exact address are kept private. Enquiries are handled through Jaipur Property Consultant.</div>
    <div class="actions">
      <a class="btn green" target="_blank" href="https://wa.me/916350566010?text=${encodeURIComponent("Hello, I am interested in the property in "+(p.area||"Jaipur")+". Please share full details.")}">💬 Enquire</a>
      <a class="btn gold" href="tel:+916350566010">📞 Call</a>
    </div>`;

  document.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>openLightbox(b.dataset.photo));
 }).catch(()=>$("loading").textContent="Could not load this property.");
}
</script>
</body>
</html>
