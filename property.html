store,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyBVkbB7kLROVu_dB-ghT906PHRSq2kscnU",authDomain:"jaipur-property-consultant.firebaseapp.com",projectId:"jaipur-property-consultant",storageBucket:"jaipur-property-consultant.firebasestorage.app",messagingSenderId:"502971407075",appId:"1:502971407075:web:ee4dabc90db9f592ebc3d6"};const db=getFirestore(initializeApp(cfg,"propertyDetail"));const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const money=(a,b)=>{const f=n=>n==null?"":"₹"+Number(n).toLocaleString("en-IN");return a!=null&&b!=null?`${f(a)} – ${f(b)}`:b!=null?`Up to ${f(b)}`:a!=null?`From ${f(a)}`:"Price on enquiry"};const id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("loading").textContent="Property not found."}else{getDoc(doc(db,"publicRequirements",id)).then(s=>{if(!s.exists()||s.data().type!=="seller"||!['Approved','approved'].includes(s.data().status)){document.getElementById("loading").textContent="This property is not available.";return}const p={id:s.id,...s.data()};document.getElementById("image").innerHTML=(p.imageDataUrl||p.imageUrls?.[0])?`<img src="${esc(p.imageDataUrl||p.imageUrls?.[0])}" alt="Property">`:'🏡';document.getElementById("loading").innerHTML=`<span class="badge">${esc(p.propertyType||"Property")}</span><h1>${esc(p.publicDisplayName||"Property Available")}</h1><div class="muted">📍 ${esc(p.area||"Jaipur")}, ${esc(p.city||"Jaipur")}</div><div class="price">${money(p.budgetMin,p.budgetMax)}</div><div class="grid">${p.size?`<div class="item"><b>Size / Area</b><span>${esc(p.size)}</span></div>`:''}<div class="item"><b>Property Type</b><span>${esc(p.propertyType||"Property")}</span></div><div class="item"><b>Location</b><span>${esc(p.area||"Jaipur")}</span></div><div class="item"><b>Contact</b><span>Through Jaipur Property Consultant</span></div></div><p>${esc(p.details||"Property det
