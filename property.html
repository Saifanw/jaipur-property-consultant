<style>
:root{--navy:#0f1b2d;--navy2:#1a2b44;--gold:#b98a1e;--gold-soft:#f6edd5;--gold2:#e8c45c;--green:#128a4d;--green-dark:#0c6f3d;--blue:#245fc4;--bg:#f5f7fa;--text:#17233a;--muted:#5d6c82;--line:#e1e7ee;--shadow:0 10px 30px rgba(15,27,45,.08);--shadow-lg:0 22px 55px rgba(15,27,45,.16);--font:Inter,"Segoe UI","Noto Sans Devanagari",Arial,sans-serif;--font-head:"Plus Jakarta Sans",Inter,"Noto Sans Devanagari",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);line-height:1.2}
.container{width:min(1200px,92%);margin:auto}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.fill{fill:currentColor;stroke:none}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:.18s;line-height:1.2;white-space:nowrap}
.btn .icon{width:18px;height:18px}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green-dark)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:#9c7316}
.btn-dark{background:var(--navy);color:#fff}
.btn-light{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn-light:hover{border-color:var(--gold)}
.btn-block{width:100%}

/* header */
.nav-wrap{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:42px;height:42px;border-radius:11px;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font:800 16px var(--font-head)}
.brand-name{font:800 18px/1.1 var(--font-head);color:var(--navy)}
.brand-sub{font-size:9.5px;letter-spacing:1.6px;color:var(--gold);font-weight:700;text-transform:uppercase;margin-top:3px}
.nav-right{display:flex;gap:8px;align-items:center}
.nav-link{padding:9px 13px;border-radius:9px;font-weight:600;font-size:14.5px;color:#33445d}
.nav-link:hover{background:var(--bg)}

.crumbs{padding:16px 0 4px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs a{font-weight:600;color:var(--navy)}.crumbs a:hover{color:var(--gold)}

/* title block */
.title-block{padding:6px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.tb-left{min-width:0}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:#eaf0fb;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
.badge.avail{background:#e8f7ef;color:#08743e;text-transform:none;letter-spacing:0;font-size:13px}
.badge.avail:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.badge.avail.offer{background:#fff6dc;color:#8a6500}.badge.avail.offer:before{background:#e0a100}
.badge.avail.sold,.badge.avail.off{background:#fff0ef;color:#b42318}.badge.avail.sold:before,.badge.avail.off:before{background:#d92d20}
h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.7px;color:var(--navy)}
.loc{display:flex;gap:6px;align-items:center;color:var(--muted);margin-top:6px;font-size:15.5px}
.loc .icon{color:var(--gold);width:18px;height:18px}
.tb-price{text-align:right}
.tb-price .lab{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.tb-price .val{font:800 clamp(26px,3vw,34px) var(--font-head);color:var(--navy)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start;padding-bottom:70px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-top:22px}
.panel:first-child{margin-top:0}
.panel h2{font-size:20px;margin-bottom:14px;color:var(--navy)}

/* gallery */
.gallery{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.stage{position:relative;aspect-ratio:16/10;background:#dfe7f0;overflow:hidden;cursor:zoom-in}
.stage .bg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(22px) brightness(.82)}
.stage .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .none{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:#8aa0b8;cursor:default}
.stage .none .icon{width:60px;height:60px;stroke-width:1.3}
.g-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:var(--navy);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2}

.g-prev{left:14px}.g-next{right:14px}
.g-count{position:absolute;right:14px;bottom:14px;background:rgba(15,27,45,.78);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;z-index:2;display:flex;gap:6px;align-items:center}
.g-count .icon{width:15px;height:15px}
.g-zoom{position:absolute;left:14px;bottom:14px;background:rgba(15,27,45,.78);color:#fff;font-size:12.5px;padding:5px 12px;border-radius:999px;z-index:2}
.thumbs{display:flex;gap:10px;padding:12px;overflow-x:auto;scrollbar-width:thin}
.thumb{flex:0 0 112px;height:78px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#e9eef4;opacity:.75;transition:.15s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{border-color:var(--gold);opacity:1}
.thumb:hover{opacity:1}

/* facts */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fact{background:#f5f8fb;border:1px solid #e8eef4;border-radius:13px;padding:14px 16px}
.fact b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.fact span{display:block;margin-top:3px;font-weight:700;font-size:16px;color:var(--navy);overflow-wrap:anywhere}
.desc{white-space:pre-line;color:#33445d;font-size:16px;line-height:1.75;overflow-wrap:anywhere}
.video-wrap{background:#0b141f;border-radius:14px;overflow:hidden}
.video-wrap video{display:block;width:100%;max-height:540px}

/* sticky side */
.side{position:sticky;top:88px}
.side-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow-lg)}
.side-card .lab{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.side-card .val{font:800 30px var(--font-head);color:var(--navy);margin:2px 0 14px}
.side-card .btn{margin-top:10px}
.side-note{display:flex;gap:10px;background:#f1f6fb;border:1px solid #dbe6f1;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#4a5d75;margin-top:16px}
.side-note .icon{color:var(--green);margin-top:2px}
.office{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.office strong{color:var(--navy);display:block;margin-bottom:2px}

/* similar */
.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sim a{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:block;transition:.2s}
.sim a:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.sim .ph{aspect-ratio:4/3;position:relative;background:#e3eaf2;overflow:hidden;display:grid;place-items:center;color:#8aa0b8}
.sim .ph img.bg{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);object-fit:cover;filter:blur(14px) brightness(.85)}
.sim .ph img.fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sim .tx{padding:14px}
.sim .tx b{display:block;font:700 16px var(--font-head);color:var(--navy)}
.sim .tx span{font-size:13.5px;color:var(--muted)}
.sim .tx em{display:block;font:800 17px var(--font-head);color:var(--navy);margin-top:6px;font-style:normal}

/* comments */
.comments{display:grid;gap:12px;margin-bottom:18px}
.comment{background:#f8fafc;border:1px solid #e6ecf2;border-radius:13px;padding:14px 16px}
.stars{color:#e0a100;letter-spacing:2px}
.notice{padding:13px 15px;border-radius:11px;background:#f1f6fb;font-size:14px;color:#4a5d75}
.cform{display:grid;gap:11px;background:#f8fafc;border:1px solid #e6ecf2;border-radius:14px;padding:18px}
.cform .row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cform label{font-size:13px;font-weight:600;color:#40526b;display:block;margin-bottom:4px}
.cform input,.cform select,.cform textarea{width:100%;padding:12px 13px;border:1px solid #d5dde8;border-radius:10px;background:#fff;font-size:15px}
.cform textarea{min-height:90px;resize:vertical}
.cform input:focus,.cform select:focus,.cform textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,138,30,.18)}

.state{text-align:center;padding:90px 20px;color:var(--muted)}
.state h1{font-size:26px;margin-bottom:8px}
.footer{background:#0a1422;color:#aab8c9;padding:26px 0;text-align:center;font-size:13.5px}
.footer a{color:var(--gold2)}

.mobile-bar{display:none}
.lightbox{position:fixed;inset:0;background:rgba(5,10,18,.95);z-index:3000;display:none;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:86vh;object-fit:contain;border-radius:8px}
.lb-btn{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:50px;height:50px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.lb-btn:hover{background:rgba(255,255,255,.26)}
.lb-prev{left:16px;top:50%;transform:translateY(-50%)}.lb-next{right:16px;top:50%;transform:translateY(-50%)}.lb-close{top:16px;right:16px}
.lb-count{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#cfd9e6;font-size:14px}

@media(min-width:981px){.tb-price{display:none}}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .tb-price{text-align:left}
  .sim{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  body{font-size:15.5px;padding-bottom:68px}
  .brand-sub,.nav-link{display:none}
  .stage{aspect-ratio:4/3}
  .g-btn{width:40px;height:40px}
  .thumb{flex-basis:88px;height:62px}
  .facts{grid-template-columns:1fr 1fr}
  .cform .row,.sim{grid-template-columns:1fr}
  .panel,.side-card{padding:18px}
  .side-card{display:none}
  .mobile-bar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:2000;background:#fff;padding:8px;gap:8px;box-shadow:0 -4px 18px rgba(0,0,0,.14)}
  .mobile-bar a{flex:1;padding:12px;border-radius:10px;color:#fff;font-weight:700;display:flex;justify-content:center;gap:8px;align-items:center}
  .mobile-bar .c{background:var(--navy)}.mobile-bar .w{background:var(--green)}
  .lb-prev{left:6px}.lb-next{right:6px}
}

$("lightbox").addEventListener("click",e=>{if(e.target===$("lightbox"))closeLb()});
document.addEventListener("keydown",e=>{
  const lb=$("lightbox").classList.contains("open");
  if(e.key==="Escape"&&lb)closeLb();
  if(e.key==="ArrowLeft"&&imgs.length>1){showImg(cur-1);if(lb)lbShow()}
  if(e.key==="ArrowRight"&&imgs.length>1){showImg(cur+1);if(lb)lbShow()}
});
let tx=null;
function swipe(el,after){
  el.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
  el.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>45){showImg(cur+(dx<0?1:-1));after&&after()}});
}
swipe($("lightbox"),lbShow);

if(!id){fail("Property not found","The link seems incomplete.")}
else getDoc(doc(db,"publicRequirements",id)).then(s=>{
  if(!s.exists()||hidden(s.data().status)){fail("This property is not available","It may have been sold or removed. See other properties below.");return}
  const p={id:s.id,...s.data()};
  const isSeller=p.type==="seller";
  imgs=photosOf(p);
  const area=cleanArea(p.area),city=tidy1(p.city)||"Jaipur";
  const type=p.propertyType||(isSeller?"Property":"Requirement");
  const title=isSeller?`${unitSize(p.size)?tidy1(p.size)+" ":""}${type} in ${area}`:`Looking for ${unitSize(p.size)?tidy1(p.size)+" ":""}${type} in ${area}`;
  const avail=String(p.availability||"Available");
  const price=priceText(p.budgetMin,p.budgetMax,isSeller?"Price on enquiry":"Budget on discussion");
  document.title=`${title} | Jaipur Property Consultant`;
  const msg=`Hello, I am interested in the ${type} in ${area} (${price}) that I saw on your website. Please share full details.`;

  const facts=[
    ["Property type",p.propertyType],["Size / area",tidy1(p.size)],["Locality",area+", "+city],
    ["Road / facing",tidy1(p.roadFacing)],["Landmark",tidy1(p.propertyLocation)&&!/^https?:/i.test(p.propertyLocation)?tidy1(p.propertyLocation):""],
    [isSeller?"Price":"Budget",price],["Availability",isSeller?avail:""]
  ].filter(f=>f[1]).map(f=>`<div class="fact"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join("");

  const gallery=imgs.length?`<div class="gallery">
      <div class="stage" id="stage" title="Click to enlarge">
        <img class="bg" id="stBg" alt="" aria-hidden="true"><img class="fg" id="stFg" alt="${esc(title)}">
        ${imgs.length>1?`<button class="g-btn g-prev" id="gPrev" type="button" aria-label="Previous photo">${ico("left")}</button><button class="g-btn g-next" id="gNext" type="button" aria-label="Next photo">${ico("right")}</button>`:""}
        <span class="g-count" id="gCount">${ico("camera")}<span><b>1</b> / ${imgs.length}</span></span>
        <span class="g-zoom">Tap to enlarge</span>
      </div>
      ${imgs.length>1?`<div class="thumbs">${imgs.map((u,i)=>`<button class="thumb${i===0?" on":""}" type="button" data-i="${i}" aria-label="Photo ${i+1}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join("")}</div>`:""}
    </div>`:`<div class="gallery"><div class="stage"><div class="none">${ico("camera")}<span>Photos available on request — WhatsApp us</span></div></div></div>`;

  const details=tidy(p.details);
  main.innerHTML=`
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>›</span><a href="properties.html">Properties</a><span>›</span><span>${esc(area)}</span></nav>
    <div class="title-block">
      <div class="tb-left">
        <div class="badges"><span class="badge">${esc(type)}</span>${isSeller?`<span class="badge avail ${availCls(avail)}">${esc(avail)}</span>`:`<span class="badge avail">Buyer requirement</span>`}</div>
        <h1>${esc(title)}</h1>
        <div class="loc">${ico("pin")}${esc(area)}, ${esc(city)}</div>
      </div>
      <div class="tb-price"><div class="lab">${isSeller?"Price":"Budget"}</div><div class="val">${esc(price)}</div></div>
    </div>
    <div class="layout">
      <div>
        ${isSeller?gallery:""}
        <section class="panel"><h2>Key details</h2><div class="facts">${facts}</div></section>
        ${details?`<section class="panel"><h2>About this ${isSeller?"property":"requirement"}</h2><div class="desc">${esc(details)}</div></section>`:""}
        ${p.videoUrl&&isSeller?`<section class="panel"><h2>Property video</h2><div class="video-wrap"><video controls playsinline preload="metadata" src="${esc(p.videoUrl)}"></video></div></section>`:""}
        <section class="panel" id="simPanel" style="display:none"><h2>Similar properties</h2><div class="sim" id="simGrid"></div></section>
        ${isSeller?`<section class="panel"><h2>Customer comments</h2>
          <div id="commentsList" class="comments"><div class="notice">Loading comments…</div></div>
          <form id="commentForm" class="cform">
            <div class="row"><div><label for="cName">Name *</label><input id="cName" required placeholder="Your name"></div>
            <div><label for="cRate">Rating</label><select id="cRate"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select></div></div>
            <div><label for="cText">Comment *</label><textarea id="cText" required placeholder="Share your comment about this property or enquiry…"></textarea></div>
            <div id="cMsg" class="notice" style="display:none"></div>
            <button class="btn btn-dark" type="submit">Submit comment</button>
          </form></section>`:""}
      </div>
      <aside class="side"><div class="side-card">
        <div class="lab">${isSeller?"Price":"Budget"}</div><div class="val">${esc(price)}</div>
        <a class="btn btn-green btn-block" target="_blank" rel="noopener" id="enqBtn" href="${wa(msg)}">${ico("wa","fill")}Enquire on WhatsApp</a>
        <a class="btn btn-gold btn-block" href="tel:+916350566010">${ico("phone")}Call 6350566010</a>
        <button class="btn btn-light btn-block" type="button" id="shareBtn">${ico("share")}Share this property</button>
        <div class="side-note">${ico("lock")}<span>Owner contact and exact address are kept private. All enquiries are handled by Jaipur Property Consultant.</span></div>
        <div class="office"><strong>Jaipur Property Consultant</strong>58A, Gosai Marg, Udyog Nagar, Jhotwara, Jaipur 302012</div>
      </div></aside>
    </div>`;
  $("mobileBar").style.display="";
  $("mobileBar").innerHTML=`<a class="c" href="tel:+916350566010">${ico("phone")}Call</a><a class="w" target="_blank" rel="noopener" href="${wa(msg)}">${ico("wa","fill")}Enquire</a>`;
  if(window.matchMedia("(min-width:641px)").matches)$("mobileBar").style.display="none";

  if(imgs.length){
    showImg(0);
    $("stage").addEventListener("click",e=>{if(e.target.closest(".g-btn"))return;openLb()});
    $("gPrev")?.addEventListener("click",()=>showImg(cur-1));
    $("gNext")?.addEventListener("click",()=>showImg(cur+1));
    document.querySelectorAll(".thumb").forEach(t=>t.addEventListener("click",()=>showImg(Number(t.dataset.i))));
    swipe($("stage"));
  }
  $("shareBtn").onclick=async()=>{
    const data={title,text:`${title} – ${price}`,url:location.href};
    try{if(navigator.share){await navigator.share(data)}else{window.open(wa(`${title} – ${price}\n${location.href}`),"_blank","noopener")}}catch(_){}
  };
  $("enqBtn").addEventListener("click",()=>{if(typeof gtag==="function")gtag("event","generate_lead",{method:"property_detail_whatsapp"})});

  /* similar properties (same type of record, other listings) */
  if(isSeller){
    onSnapshot(query(collection(db,"publicRequirements"),where("type","==","seller")),snap=>{
      let rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.id!==p.id&&!hidden(r.status)&&String(r.availability||"Available")!=="Not Available");
      rows.sort((a,b)=>((b.propertyType===p.propertyType)-(a.propertyType===p.propertyType))||((cleanArea(b.area)===area)-(cleanArea(a.area)===area)));
      rows=rows.slice(0,3);
      if(!rows.length)return;
      $("simPanel").style.display="";
      $("simGrid").innerHTML=rows.map(r=>{const im=photosOf(r)[0];return`<a href="property.html?id=${encodeURIComponent(r.id)}"><div class="ph">${im?`<img class="bg" src="${esc(im)}" alt="" loading="lazy"><img class="fg" src="${esc(im)}" alt="" loading="lazy">`:ico("camera")}</div><div class="tx"><b>${esc(`${unitSize(r.size)?tidy1(r.size)+" ":""}${r.propertyType||"Property"}`)}</b><span>${esc(cleanArea(r.area))}, Jaipur</span><em>${esc(priceText(r.budgetMin,r.budgetMax,"Price on enquiry"))}</em></div></a>`}).join("");
    },()=>{});
  }

  /* comments (approved only) */
  if(isSeller){
    onSnapshot(query(collection(db,"publicReviews"),where("propertyId","==",p.id),where("status","==","approved")),snap=>{
      const rows=snap.docs.map(d=>d.data());
      $("commentsList").innerHTML=rows.length?rows.map(r=>{const n=Math.max(1,Math.min(5,Number(r.rating)||5));return`<article class="comment"><div class="stars">${"★".repeat(n)}${"☆".repeat(5-n)}</div><strong>${esc(r.name||"Customer")}</strong><div style="margin-top:5px;color:#435166">${esc(r.comment||"")}</div></article>`}).join(""):'<div class="notice">No approved comments yet. You can be the first to comment.</div>';
    },()=>{$("commentsList").innerHTML='<div class="notice">Comments could not be loaded right now.</div>'});
    $("commentForm").onsubmit=async e=>{
      e.preventDefault();const b=e.target.querySelector("button"),m=$("cMsg");b.disabled=true;b.textContent="Submitting…";m.style.display="block";
      try{await addDoc(collection(db,"publicReviews"),{propertyId:p.id,propertyTitle:title,name:$("cName").value.trim(),rating:Number($("cRate").value),comment:$("cText").value.trim(),area:p.area||"",propertyType:p.propertyType||"",consent:true,status:"pending",source:"Property Page",submittedAt:serverTimestamp()});m.textContent="✅ Comment submitted. It will appear after approval.";e.target.reset()}
      catch(err){m.textContent="Could not submit the comment. Please try again.";console.warn(err)}
      finally{b.disabled=false;b.textContent="Submit comment"}
    };
  }
}).catch(err=>{console.warn(err);fail("Could not load this property","Please check your internet connection and try again.")});
</script>
</body>
</html>
