<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Reviews | Jaipur Property Consultant</title>
<meta name="description" content="Read honest reviews from buyers and sellers who worked with Jaipur Property Consultant, or share your own experience.">
<meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0DW0NBETML"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-0DW0NBETML');</script>
</head>
<body>
<div data-chrome="reviews"></div>
<main>
<section class="phero" style="padding:30px 0 26px"><div class="container"><div class="crumbs"><a href="index.html">Home</a> / Reviews</div><h1>What customers say</h1><p>Only reviews we have checked are shown. Nothing is edited or removed because it is critical.</p></div></section>
<div class="container sec" style="padding-top:36px">
  <div id="summary"></div>
  <div class="rlist" id="list"></div>

  <div class="twoup" style="align-items:start;margin-top:40px">
    <div><h2 style="font-size:26px">Worked with us? Tell others.</h2><p class="lead">A few honest lines help the next buyer or seller. Your review appears after our team checks it.</p></div>
    <form class="panel" id="rForm" novalidate>
      <div class="fld"><label id="rStarLbl">Your rating</label>
        <div class="starpick" role="radiogroup" aria-labelledby="rStarLbl">
          <input type="radio" name="rate" id="s5" value="5" checked><label for="s5" title="5 stars">★</label>
          <input type="radio" name="rate" id="s4" value="4"><label for="s4" title="4 stars">★</label>
          <input type="radio" name="rate" id="s3" value="3"><label for="s3" title="3 stars">★</label>
          <input type="radio" name="rate" id="s2" value="2"><label for="s2" title="2 stars">★</label>
          <input type="radio" name="rate" id="s1" value="1"><label for="s1" title="1 star">★</label>
        </div></div>
      <div class="fld"><label for="rName">Your name</label><input id="rName" autocomplete="name" required></div>
      <div class="fld"><label for="rArea">Area (optional)</label><input id="rArea" placeholder="e.g. Jhotwara"></div>
      <div class="fld"><label for="rText">Your experience</label><textarea id="rText" required placeholder="What did we help you with? How was it?"></textarea></div>
      <button class="btn btn-gold btn-block" id="rBtn" type="submit">Submit review</button>
      <div id="rMsg" class="msg" style="display:none"></div>
    </form>
  </div>
</div>
</main>
<script src="assets/i18n.js"></script>
<script src="assets/config.js"></script>
<script src="assets/sprite.js"></script>
<script src="assets/app.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, where, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const db = getFirestore(initializeApp({apiKey:"AIzaSyBVkbB7kLROVu_dB-ghT906PHRSq2kscnU",authDomain:"jaipur-property-consultant.firebaseapp.com",projectId:"jaipur-property-consultant",storageBucket:"jaipur-property-consultant.firebasestorage.app",messagingSenderId:"502971407075",appId:"1:502971407075:web:ee4dabc90db9f592ebc3d6"},"publicSite"));
const { $, esc, millis, tidy } = JPC;
const stars = n => "★".repeat(n) + "☆".repeat(5 - n);
onSnapshot(query(collection(db, "publicReviews"), where("status", "==", "approved")), snap => {
  const rows = snap.docs.map(d => d.data()).sort((a,b) => millis(b.submittedAt) - millis(a.submittedAt));
  if(!rows.length){
    $("summary").innerHTML = '<div class="empty-box"><strong>No reviews yet</strong>Be the first to share your experience below.</div>'; $("list").innerHTML = ""; return;
  }
  const rate = r => Math.max(1, Math.min(5, Number(r.rating) || 5));
  const avg = rows.reduce((a,r) => a + rate(r), 0) / rows.length;
  const dist = [5,4,3,2,1].map(n => rows.filter(r => rate(r) === n).length);
  $("summary").innerHTML = `<div class="rsum"><div><div class="avg">${avg.toFixed(1)}</div><div class="stars" aria-label="${avg.toFixed(1)} out of 5">${stars(Math.round(avg))}</div><div class="fine">${rows.length} ${rows.length === 1 ? "review" : "reviews"}</div></div><div class="bars">${dist.map((c,i) => `<div class="bar"><span>${5-i} ★</span><i><s style="width:${Math.round(c/rows.length*100)}%"></s></i><span>${c}</span></div>`).join("")}</div></div>`;
  $("list").innerHTML = rows.map(r => { const n = rate(r), nm = tidy(r.name) || "Customer", ctx = [r.propertyType, r.area].filter(Boolean).map(tidy).join(" • ");
    return `<article class="rcard"><div class="stars" aria-label="${n} out of 5">${stars(n)}</div><p>“${esc(r.comment || "")}”</p><div class="who"><div class="rav">${esc(nm.charAt(0).toUpperCase())}</div><div><strong>${esc(nm)}</strong>${ctx ? `<span>${esc(ctx)}</span>` : ""}</div></div></article>`; }).join("");
}, () => { $("summary").innerHTML = '<div class="empty-box"><strong>Reviews could not be loaded right now</strong>Please try again in a moment.</div>'; });

$("rForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("rMsg"), btn = $("rBtn"), show = (t, ok) => { msg.style.display = "block"; msg.className = "msg " + (ok ? "ok" : "err"); msg.textContent = t; };
  const name = $("rName").value.trim(), text = $("rText").value.trim(), rating = Number(document.querySelector('input[name=rate]:checked')?.value || 5);
  if(!name) return show("Please enter your name.");
  if(text.length < 10) return show("Please write a few words about your experience.");
  btn.disabled = true; btn.textContent = "Submitting…";
  try{
    await addDoc(collection(db, "publicReviews"), { name, rating, comment: text, area: $("rArea").value.trim(), consent: true, status: "pending", source: "Public Website", submittedAt: serverTimestamp() });
    show("Thank you. Your review will appear after our team checks it.", true); e.target.reset();
  }catch(err){ show("Could not submit right now. Please try again."); }
  finally{ btn.disabled = false; btn.textContent = "Submit review"; }
});
</script>
<script type="module" src="assets/jpc-analytics-tracker.js"></script>
</body>
</html>
