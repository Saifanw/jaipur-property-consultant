<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reviews | Jaipur Property Consultant</title><style>:root{--navy:#111c2d;--gold:#c79a25;--green:#128a4d;--bg:#f4f7fa;--text:#182437;--muted:#66758a;--line:#dfe5ec}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{width:min(980px,94%);margin:auto}.head{background:#fff;border-bottom:1px solid var(--line);padding:17px 0}.head-in{display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-size:21px;font-weight:950}.nav{display:flex;gap:14px;font-size:12px;font-weight:800}.hero{background:linear-gradient(135deg,#132238,#233b57);color:#fff;padding:42px 0}.hero h1{font-size:38px;margin:8px 0}.hero p{color:#d8e1eb}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:25px 0}.review{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.stars{color:#c79a25;letter-spacing:2px}.muted{font-size:11px;color:var(--muted)}.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:25px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:10px;font-weight:900;color:#53657a}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:100px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:850;cursor:pointer}.gold{background:var(--gold);color:#fff}.notice{padding:11px;border-radius:9px;background:#eef4ff;color:#275da8;font-size:11px;margin-top:10px}.footer{background:#0b1725;color:#c8d3df;padding:25px 0;text-align:center;font-size:11px;margin-top:50px}@media(max-width:650px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:30px}.head-in{display:block}.nav{margin-top:10px}}
</style></head><body><header class="head"><div class="wrap head-in"><a href="index.html"><div class="brand">Jaipur Property Consultant</div></a><nav class="nav"><a href="index.html">Home</a><a href="properties.html">Properties</a><a href="reviews.html">Reviews</a><a href="admin.html">Admin</a></nav></div></header><section class="hero"><div class="wrap"><div style="font-size:10px;color:#e8c45c;font-weight:900;letter-spacing:1.5px">COMMUNITY FEEDBACK</div><h1>💬 Customer Reviews & Experiences</h1><p>Reviews submit kiye ja sakte hain. Public website par sirf approved reviews dikhte hain.</p></div></section><main class="wrap"><div class="grid" id="reviews"><div class="review">Loading reviews...</div></div><form class="form" id="reviewForm"><h2>Apna Review Share Karein</h2><div class="fields"><div class="field"><label>Name *</label><input id="name" required placeholder="Your name"></div><div class="field"><label>Rating *</label><select id="rating"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select></div><div class="field"><label>Area / Location</label><input id="area" placeholder="e.g. Jhotwara"></div><div class="field"><label>Property Type</label><input id="propertyType" placeholder="Plot / House / Flat"></div><div class="field full"><label>Comment *</label><textarea id="comment" required placeholder="Apna experience ya feedback likhein..."></textarea></div><div class="field full"><label><input id="consent" type="checkbox" required> I agree that this review may be published after approval.</label></div></div><div id="msg"></div><button class="btn gold" id="submit">Submit Review</button></form></main><footer class="footer">Jaipur Property Consultant • Jhotwara, Jaipur • <a href="index.html" style="color:#e8c45c">Home</a></footer><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getFirestore,collection,addDoc,query,where,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyBVkbB7kLROVu_dB-ghT906PHRSq2kscnU",authDomain:"jaipur-property-consultant.firebaseapp.com",projectId:"jaipur-property-consultant",storageBucket:"jaipur-property-consultant.firebasestorage.app",messagingSenderId:"502971407075",appId:"1:502971407075:web:ee4dabc90db9f592ebc3d6"};const db=getFirestore(initializeApp(cfg,"reviewsPage"));const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));function render(docs){const list=docs.filter(d=>d.status==="approved");document.getElementById("reviews").innerHTML=list.length?list.map(r=>`<article class="review"><div class="stars">${"★".repeat(Number(r.rating)||5)}${"☆".repeat(5-(Number(r.rating)||5))}</div><h3>${esc(r.name||"Customer")}</h3><div>${esc(r.comment||"")}</div><div class="muted" style="margin-top:8px">${esc(r.area||"")} ${r.propertyType?"• "+esc(r.propertyType):""}</div></article>`).join(""):'<div class="review">Abhi approved reviews nahi hain. Aap pehla review share kar sakte hain.</div>'}onSnapshot(query(collection(db,"publicReviews"),where("status","==","approved")),snap=>render(snap.docs.map(d=>d.data())),err=>console.warn(err));document.getElementById("reviewForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("msg");b.disabled=true;b.textContent="Submitting...";try{await addDoc(collection(db,"publicReviews"),{name:document.getElementById("name").value.trim(),rating:Number(document.getElementById("rating").value),area:document.getElementById("area").value.trim(),propertyType:document.getElementById("propertyType").value.trim(),comment:document.getElementById("comment").value.trim(),consent:true,status:"pending",source:"Public Website",submittedAt:serverTimestamp()});m.innerHTML='<div class="notice">✅ Review submit ho gaya. Approval ke baad public hoga.</div>';e.target.reset()}catch(err){m.innerHTML=`<div class="notice" style="background:#fff0ef;color:#b42318">${esc(err.message)}</div>`}finally{b.disabled=false;b.textContent="Submit Review"}};</script></body></html>
